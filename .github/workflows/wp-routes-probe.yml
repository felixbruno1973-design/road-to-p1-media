name: ROAD TO P1 Probe WordPress REST Routes

on:
  push:
    branches: [main]
    paths:
      - wp-routes-probe.json

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      WP_URL: https://road-to-p1.com
      WP_USERNAME: roadtop1-media
    steps:
      - uses: actions/checkout@v4
      - name: Probe REST routes
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o routes.json -w '%{http_code}'             -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD"             -H "Accept: application/json"             "$WP_URL/wp-json/")"
          echo "HTTP $CODE"
          [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ] || { cat routes.json; exit 1; }
          jq -r '.routes | keys[]' routes.json | grep -Ei 'elementor|cache|optimi|clear|regener|flush|purge' || true
          echo "---- Kadence / theme / customizer / option routes ----"
          jq -r '.routes | keys[]' routes.json | grep -Ei 'kadence|customiz|theme|option|settings' || true
          echo "---- WP settings keys ----"
          SCODE="$(curl -sS -o settings.json -w '%{http_code}' -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" -H "Accept: application/json" "$WP_URL/wp-json/wp/v2/settings")"
          echo "Settings HTTP $SCODE"
          if [ "$SCODE" -ge 200 ] && [ "$SCODE" -lt 300 ]; then jq -r 'keys[]' settings.json | sort; else cat settings.json; fi
          echo "---- /elementor/v1/cache ----"
          jq '.routes["/elementor/v1/cache"]' routes.json
          echo "---- /elementor/v1/post ----"
          jq '.routes["/elementor/v1/post"]' routes.json
          echo "---- /elementor/v1/documents ----"
          jq '.routes["/elementor/v1/documents"]' routes.json
          echo "---- routes containing save/update/document ----"
          jq -r '.routes | keys[]' routes.json | grep -Ei 'document|save|update' | grep -Ei 'elementor' || true

      - name: Probe Elementor authenticated user endpoints
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for PATH in "/wp-json/elementor/v1/user-data/current-user" "/wp-json/elementor/v1/user" "/wp-json/elementor/v1/system-info"; do
            NAME="$(echo "$PATH" | tr '/-' '__')"
            CODE="$(curl -sS -o "$NAME.json" -w '%{http_code}'               -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD"               -H "Accept: application/json" "$WP_URL$PATH")"
            echo "ENDPOINT $PATH -> HTTP $CODE"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
              jq -c '.. | objects | to_entries[]? | select(.key|test("nonce|ajax";"i")) | {key:.key,value:.value}' "$NAME.json" || true
              echo "TOP_LEVEL_KEYS"
              jq -r 'if type=="object" then keys[] else empty end' "$NAME.json" || true
            else
              cat "$NAME.json"
            fi
          done
