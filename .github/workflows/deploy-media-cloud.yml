name: Deploy Media Cloud

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloud/**"
      - ".github/workflows/deploy-media-cloud.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RTP1_MEDIA_AUTH_SECRET: ${{ secrets.RTP1_MEDIA_AUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RTP1_MEDIA_AUTH_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Ensure R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          if wrangler r2 bucket list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.exit(x.some(b=>b.name==='road-to-p1-media')?0:1)})"; then
            echo "R2 bucket already exists."
          else
            wrangler r2 bucket create road-to-p1-media
          fi

      - name: Ensure D1 database and generate config
        shell: bash
        run: |
          set -euo pipefail
          DB_ID="$(wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);const d=x.find(v=>v.name==='road-to-p1-media');if(d)process.stdout.write(d.uuid||d.id||'')})")"
          if [ -z "$DB_ID" ]; then
            OUT="$(wrangler d1 create road-to-p1-media --json)"
            DB_ID="$(printf '%s' "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.stdout.write(x.uuid||x.id||x.d1_database_id||'')})")"
          fi
          test -n "$DB_ID"
          cp cloud/wrangler.toml.example cloud/wrangler.toml
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/g" cloud/wrangler.toml

      - name: Apply D1 schema
        run: wrangler d1 execute road-to-p1-media --remote --file=cloud/schema.sql --config cloud/wrangler.toml

      - name: Set Worker authentication secret
        shell: bash
        run: printf '%s' "$RTP1_MEDIA_AUTH_SECRET" | wrangler secret put AUTH_SECRET --config cloud/wrangler.toml

      - name: Deploy Worker
        run: wrangler deploy --config cloud/wrangler.toml
