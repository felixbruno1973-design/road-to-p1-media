name: Windows desktop validation
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'desktop-usb.js'
      - 'studio-assistant.js'
      - 'studio-usb-bridge.js'
      - 'scripts/render-local-mp4.mjs'
      - 'tests/**'
      - 'scripts/prepare-desktop.mjs'
      - 'scripts/generate-windows-icon.mjs'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare desktop frontend
        run: npm run desktop:prepare
      - name: Check JavaScript
        run: npm run check
      - name: Test JavaScript
        run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile native tests without running Windows installer
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build Windows installer
        run: cargo tauri build
      - name: Publish installer as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: road-to-p1-media-windows-prototype
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
