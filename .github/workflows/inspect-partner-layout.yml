name: ROAD TO P1 Inspect Partner CTA and Layout

on:
  push:
    branches: [main]
    paths:
      - partner-layout-inspect.json

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      WP_URL: https://road-to-p1.com
      WP_USERNAME: roadtop1-media
    steps:
      - uses: actions/checkout@v4

      - name: Inspect homepage and Partenaires
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for ID in 10 11; do
            curl -sS -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD"               -H "Accept: application/json"               "$WP_URL/wp-json/wp/v2/pages/$ID?context=edit" > "page-$ID.json"
          done

          jq -r '.meta._elementor_data' page-10.json > home-elementor.json
          jq -r '.meta._elementor_data' page-11.json > partners-elementor.json

          echo "=== HOME PARTNER MATCHES ==="
          jq -c '.. | objects | select((.settings? // {} | tostring | ascii_downcase | contains("partenaire")) or (.settings? // {} | tostring | ascii_downcase | contains("partner"))) | {id,elType,widgetType,settings}' home-elementor.json

          echo "=== PARTENAIRES IMAGE AND CONTAINER NODES ==="
          jq -c '.. | objects | select(.id? as $id | ["8735702","49caa96","5eb18ed","2394503","3458751","da8e127","8f33e70","bb25799","2f26c83","85e81e3","69af66f","7bc94b4"] | index($id)) | {id,elType,widgetType,settings}' partners-elementor.json
