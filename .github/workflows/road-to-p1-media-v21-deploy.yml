name: Deploy Road to P1 Media V2.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/road-to-p1-media-v21-deploy.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish V2.1
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v21-payload/* | tr -d '\n\r ' | base64 -d > /tmp/v21.tar.gz
          echo "65a8afc62c0fcb6a94e5826edd57bd8a50bb1d58a7a305bf509b30b3c7e8be7b  /tmp/v21.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v21.tar.gz -C .
          test "$(git hash-object README.md)" = "327774b6d4b0ebc82364d671bf8ccefec56f0ce2"
          test "$(git hash-object app.js)" = "c39f106ed0ffc0191083fed7a2c4ac4fe502f737"
          test "$(git hash-object index.html)" = "d6f32d7484911603db9a236e25d857d17f0644c8"
          test "$(git hash-object package.json)" = "4b1d9e6ee14d7734cc2e16a0d0a0387ac18a9d8b"
          test "$(git hash-object style.css)" = "2df05060a02b1b9a8429c851f482e716a317a5ef"
          node --check app.js
          npm test
          rm -rf .github/v21-payload .github/workflows/road-to-p1-media-v21-deploy.yml
          git config user.name "Road to P1 Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Road to P1 Media V2.1"
          git push origin HEAD:main
