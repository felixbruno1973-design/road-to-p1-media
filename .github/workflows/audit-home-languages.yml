name: ROAD TO P1 Audit FR EN Homepages

on:
  push:
    branches: [main]
    paths:
      - home-language-audit.json

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WP_URL: https://road-to-p1.com
      WP_USERNAME: roadtop1-media
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pages and media
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for ID in 10 9968; do
            curl -sS -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" -H "Accept: application/json" "$WP_URL/wp-json/wp/v2/pages/$ID?context=edit" > "page-$ID.json"
          done
          curl -sS -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" -H "Accept: application/json" "$WP_URL/wp-json/rtp1-media/v1/pages" > pages.json
          curl -sS -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" -H "Accept: application/json" "$WP_URL/wp-json/wp/v2/media?per_page=100&search=Flyer" > media-flyer.json || true
          curl -sS -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" -H "Accept: application/json" "$WP_URL/wp-json/wp/v2/media?per_page=100&search=2027" > media-2027.json || true

      - name: Summarize structures, texts and links
        run: python scripts/audit_home_languages.py
