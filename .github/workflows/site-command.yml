name: ROAD TO P1 Site Command

on:
  push:
    branches: [main]
    paths:
      - site-command.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: road-to-p1-site-command
  cancel-in-progress: false

jobs:
  run-command:
    runs-on: ubuntu-latest
    env:
      WP_URL: https://road-to-p1.com
      WP_USERNAME: roadtop1-media
      API: /wp-json/rtp1-media/v1
    steps:
      - uses: actions/checkout@v4

      - name: Validate command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          with open("site-command.json", encoding="utf-8") as f:
              d = json.load(f)
          enabled = bool(d.get("enabled", False))
          command_id = d.get("command_id", "")
          mode = d.get("mode", "")
          path = d.get("page_path", "")
          source = d.get("source_text", "")
          replacement = d.get("replacement_text", "")
          confirm = d.get("confirm", False)

          if not isinstance(command_id, str) or not re.fullmatch(r"[A-Za-z0-9._-]{1,80}", command_id):
              raise SystemExit("Invalid command_id")
          if mode != "exact_text_replace":
              raise SystemExit("Only exact_text_replace is enabled on this bridge")
          if not isinstance(path, str) or not path.startswith("/") or "://" in path or ".." in path:
              raise SystemExit("Invalid page_path")
          if not isinstance(source, str) or not source or len(source) > 1000:
              raise SystemExit("Invalid source_text")
          if not isinstance(replacement, str) or not replacement or len(replacement) > 1000:
              raise SystemExit("Invalid replacement_text")
          if source == replacement:
              raise SystemExit("Source and replacement are identical")
          if not isinstance(confirm, bool):
              raise SystemExit("confirm must be boolean")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as g:
              g.write(f"enabled={'true' if enabled else 'false'}\n")
          print("Command:", command_id)
          print("Enabled:", enabled)
          print("Target path:", path)
          print("Mode:", mode)
          print("Confirm:", confirm)
          PY

      - name: Disabled command
        if: steps.command.outputs.enabled != 'true'
        run: echo "Command disabled; nothing sent to WordPress."

      - name: Check WordPress secret
        if: steps.command.outputs.enabled == 'true'
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RTP1_WP_APP_PASSWORD" ]; then
            echo "::error::Missing repository secret RTP1_WP_APP_PASSWORD."
            exit 1
          fi

      - name: Resolve WordPress page
        if: steps.command.outputs.enabled == 'true'
        id: page
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS -o pages.json -w '%{http_code}' \
            -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" \
            -H "Accept: application/json" \
            "$WP_URL$API/pages")"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            jq . pages.json 2>/dev/null || cat pages.json
            echo "::error::WordPress pages request failed (HTTP $HTTP_CODE)."
            exit 1
          fi

          PAGE_ID="$(python - <<'PY'
          import json
          from urllib.parse import urlparse
          cmd=json.load(open("site-command.json",encoding="utf-8"))
          data=json.load(open("pages.json",encoding="utf-8"))
          target=cmd["page_path"].rstrip("/") or "/"
          matches=[]
          for p in data.get("pages",[]):
              path=urlparse(p.get("link","")).path.rstrip("/") or "/"
              if path == target:
                  matches.append(p)
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one page for {target!r}; found {len(matches)}")
          print(matches[0]["id"])
          PY
          )"
          echo "page_id=$PAGE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved WordPress page ID: $PAGE_ID"

      - name: Read page snapshot
        if: steps.command.outputs.enabled == 'true'
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
          PAGE_ID: ${{ steps.page.outputs.page_id }}
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS -o snapshot.json -w '%{http_code}' \
            -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" \
            -H "Accept: application/json" \
            "$WP_URL$API/snapshot/$PAGE_ID")"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            jq . snapshot.json 2>/dev/null || cat snapshot.json
            echo "::error::WordPress snapshot failed (HTTP $HTTP_CODE)."
            exit 1
          fi
          jq '{ok,page,revision,elementCount:(.elements|length)}' snapshot.json

          CORE_HTTP="$(curl -sS -o core-page.json -w '%{http_code}'             -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD"             -H "Accept: application/json"             "$WP_URL/wp-json/wp/v2/pages/$PAGE_ID?context=edit")"
          if [ "$CORE_HTTP" -lt 200 ] || [ "$CORE_HTTP" -ge 300 ]; then
            echo "{}" > core-page.json
          fi

      - name: Build exact replacement draft
        if: steps.command.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          cmd = json.load(open("site-command.json", encoding="utf-8"))
          snap = json.load(open("snapshot.json", encoding="utf-8"))
          source = cmd["source_text"]
          replacement = cmd["replacement_text"]
          matches = []

          for element in snap.get("elements", []):
              element_id = element.get("id", "")
              settings = element.get("settings") or {}
              controls = element.get("controls") or {}

              for key in ("title", "text", "editor"):
                  value = settings.get(key)
                  if key in controls and isinstance(value, str) and source in value:
                      matches.append({
                          "kind": "setting",
                          "elementId": element_id,
                          "key": key,
                          "selector": "",
                          "device": "all",
                          "value": json.dumps(value.replace(source, replacement), ensure_ascii=False),
                          "reason": f"Correction exacte de « {source} » en « {replacement} »."
                      })

              html = element.get("html") or {}
              for text_node in html.get("texts", []):
                  if isinstance(text_node, str) and source in text_node:
                      matches.append({
                          "kind": "html_text",
                          "elementId": element_id,
                          "key": text_node,
                          "selector": "",
                          "device": "all",
                          "value": text_node.replace(source, replacement),
                          "reason": f"Correction exacte de « {source} » en « {replacement} »."
                      })

          if len(matches) != 1:
              core = json.load(open("core-page.json", encoding="utf-8"))
              paths = []
              def walk(v, path="$"):
                  if isinstance(v, dict):
                      for k, x in v.items():
                          walk(x, f"{path}.{k}")
                  elif isinstance(v, list):
                      for i, x in enumerate(v):
                          walk(x, f"{path}[{i}]")
                  elif isinstance(v, str) and source in v:
                      paths.append(path)
              walk(core)
              print("Editable catalogue matches:", len(matches))
              print("Core REST occurrences:", len(paths))
              for p in paths[:20]:
                  print("Core path containing source:", p)
              raise SystemExit(f"Safety stop: expected exactly one editable occurrence of {source!r}, found {len(matches)}")

          body = {
              "pageId": int(snap["page"]["id"]),
              "revision": snap["revision"],
              "instruction": f"Remplacer uniquement « {source} » par « {replacement} ».",
              "summary": f"Correction : {source} → {replacement}",
              "device": "all",
              "changes": matches
          }
          with open("draft-request.json","w",encoding="utf-8") as f:
              json.dump(body,f,ensure_ascii=False,separators=(",",":"))
          print("Exactly one editable occurrence found.")
          print("Element:", matches[0]["elementId"], "kind:", matches[0]["kind"], "key:", matches[0]["key"])
          PY

      - name: Create protected WordPress draft
        if: steps.command.outputs.enabled == 'true'
        id: draft
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS -o draft-response.json -w '%{http_code}' \
            -X POST \
            -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" \
            -H "Content-Type: application/json" \
            --data-binary @draft-request.json \
            "$WP_URL$API/draft")"

          jq '.draft | {id,status,summary,diff}' draft-response.json 2>/dev/null || cat draft-response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || [ "$(jq -r '.ok // false' draft-response.json 2>/dev/null)" != "true" ]; then
            echo "::error::WordPress draft failed (HTTP $HTTP_CODE)."
            exit 1
          fi

          DRAFT_ID="$(jq -r '.draft.id' draft-response.json)"
          echo "draft_id=$DRAFT_ID" >> "$GITHUB_OUTPUT"

      - name: Generate protected preview
        if: steps.command.outputs.enabled == 'true'
        id: preview
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
          DRAFT_ID: ${{ steps.draft.outputs.draft_id }}
        run: |
          set -euo pipefail
          jq -n --arg draftId "$DRAFT_ID" '{draftId:$draftId}' > preview-request.json
          HTTP_CODE="$(curl -sS -o preview-response.json -w '%{http_code}' \
            -X POST \
            -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" \
            -H "Content-Type: application/json" \
            --data-binary @preview-request.json \
            "$WP_URL$API/preview")"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || [ "$(jq -r '.ok // false' preview-response.json 2>/dev/null)" != "true" ]; then
            jq '{ok,code,message,data}' preview-response.json 2>/dev/null || cat preview-response.json
            echo "::error::WordPress preview failed (HTTP $HTTP_CODE). Nothing was published."
            exit 1
          fi

          REVIEW_HASH="$(jq -r '.reviewHash // empty' preview-response.json)"
          if [ -z "$REVIEW_HASH" ]; then
            echo "::error::Preview returned no review hash."
            exit 1
          fi
          echo "review_hash=$REVIEW_HASH" >> "$GITHUB_OUTPUT"
          echo "Protected preview generated successfully."

      - name: Publish confirmed exact replacement
        if: steps.command.outputs.enabled == 'true'
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
          DRAFT_ID: ${{ steps.draft.outputs.draft_id }}
          REVIEW_HASH: ${{ steps.preview.outputs.review_hash }}
        run: |
          set -euo pipefail
          CONFIRM="$(jq -r '.confirm' site-command.json)"
          if [ "$CONFIRM" != "true" ]; then
            echo "Draft and preview created; publication not confirmed."
            exit 0
          fi

          jq -n --arg draftId "$DRAFT_ID" --arg reviewHash "$REVIEW_HASH" \
            '{draftId:$draftId,reviewHash:$reviewHash,confirm:true}' > apply-request.json

          HTTP_CODE="$(curl -sS -o apply-response.json -w '%{http_code}' \
            -X POST \
            -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" \
            -H "Content-Type: application/json" \
            --data-binary @apply-request.json \
            "$WP_URL$API/apply")"

          jq '.draft | {id,status,summary,receipt}' apply-response.json 2>/dev/null || cat apply-response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || [ "$(jq -r '.ok // false' apply-response.json 2>/dev/null)" != "true" ]; then
            echo "::error::Publication failed (HTTP $HTTP_CODE). Check history before retrying."
            exit 1
          fi

          STATUS="$(jq -r '.draft.status // empty' apply-response.json)"
          if [ "$STATUS" != "applied" ]; then
            echo "::error::Unexpected draft status: $STATUS"
            exit 1
          fi
          echo "ROAD TO P1 publication confirmed by WordPress."
