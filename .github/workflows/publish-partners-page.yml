name: ROAD TO P1 Publish Partenaires Page

on:
  push:
    branches: [main]
    paths:
      - partners-page-update.json

permissions:
  contents: read

concurrency:
  group: road-to-p1-partners-page
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WP_URL: https://road-to-p1.com
      WP_USERNAME: roadtop1-media
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$RTP1_WP_APP_PASSWORD" ] || { echo "::error::Missing WordPress app password"; exit 1; }

      - name: Read current page
        id: page
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          PAGE_ID="$(jq -r '.page_id' partners-page-update.json)"
          CODE="$(curl -sS -o page-before.json -w '%{http_code}' \
            -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" \
            -H "Accept: application/json" \
            "$WP_URL/wp-json/wp/v2/pages/$PAGE_ID?context=edit")"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            jq . page-before.json 2>/dev/null || cat page-before.json
            echo "::error::Unable to read WordPress page (HTTP $CODE)"
            exit 1
          fi
          python - <<'PY'
          import json
          from urllib.parse import urlparse
          req=json.load(open("partners-page-update.json",encoding="utf-8"))
          p=json.load(open("page-before.json",encoding="utf-8"))
          path=urlparse(p.get("link","")).path.rstrip("/") or "/"
          expected=req["page_path"].rstrip("/") or "/"
          if p.get("id")!=req["page_id"] or path!=expected:
              raise SystemExit(f"Safety stop: page mismatch id={p.get('id')} path={path!r}")
          meta=(p.get("meta") or {}).get("_elementor_data")
          data=json.loads(meta) if isinstance(meta,str) else meta
          if not isinstance(data,list):
              raise SystemExit("Safety stop: Elementor data unavailable")
          wanted={
              req["heading_element_id"]:("heading","title"),
              req["intro_element_id"]:("text-editor","editor"),
              req["closing_element_id"]:("text-editor","editor")
          }
          found={}
          def walk(nodes):
              for n in nodes or []:
                  i=n.get("id")
                  if i in wanted:
                      found[i]=n
                  walk(n.get("elements") or [])
          walk(data)
          if set(found)!=set(wanted):
              raise SystemExit(f"Safety stop: expected elements {sorted(wanted)}, found {sorted(found)}")
          for eid,(typ,key) in wanted.items():
              n=found[eid]
              if n.get("widgetType")!=typ or key not in (n.get("settings") or {}):
                  raise SystemExit(f"Safety stop: unexpected widget structure for {eid}")
          print("Validated target page and Elementor elements.")
          PY
          echo "page_id=$PAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Save backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: partenaires-before-${{ github.run_id }}
          path: page-before.json
          retention-days: 30

      - name: Build approved update
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          req=json.load(open("partners-page-update.json",encoding="utf-8"))
          if req.get("confirm") is not True:
              raise SystemExit("Publication not confirmed in command file")
          p=json.load(open("page-before.json",encoding="utf-8"))
          meta=(p.get("meta") or {}).get("_elementor_data")
          data=json.loads(meta) if isinstance(meta,str) else meta
          replacements={
              req["heading_element_id"]:("title",req["heading"]),
              req["intro_element_id"]:("editor",req["intro_html"]),
              req["closing_element_id"]:("editor",req["closing_html"])
          }
          changed=[]
          def walk(nodes):
              for n in nodes or []:
                  eid=n.get("id")
                  if eid in replacements:
                      key,val=replacements[eid]
                      n.setdefault("settings",{})[key]=val
                      changed.append(eid)
                  walk(n.get("elements") or [])
          walk(data)
          if len(changed)!=3 or len(set(changed))!=3:
              raise SystemExit(f"Safety stop: unexpected changed element count {changed}")
          json.dump({"meta":{"_elementor_data":data}},open("page-update.json","w",encoding="utf-8"),ensure_ascii=False,separators=(",",":"))
          print("Prepared update for exactly three Elementor widgets:", changed)
          PY

      - name: Publish update
        id: publish
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
          PAGE_ID: ${{ steps.page.outputs.page_id }}
        run: |
          set -euo pipefail
          SUCCESS=0
          for ATTEMPT in 1 2 3; do
            CODE="$(curl -sS -o update-response.json -w '%{http_code}' \
              -X POST \
              -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" \
              -H "Content-Type: application/json" \
              --data-binary @page-update.json \
              "$WP_URL/wp-json/wp/v2/pages/$PAGE_ID")"
            echo "Publish attempt $ATTEMPT -> HTTP $CODE"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
              SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ "$SUCCESS" != "1" ]; then
            jq . update-response.json 2>/dev/null || cat update-response.json
            echo "::error::WordPress publication failed after retries."
            exit 1
          fi

      - name: Verify stored Elementor content
        shell: bash
        env:
          RTP1_WP_APP_PASSWORD: ${{ secrets.RTP1_WP_APP_PASSWORD }}
          PAGE_ID: ${{ steps.page.outputs.page_id }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o page-after.json -w '%{http_code}' \
            -u "$WP_USERNAME:$RTP1_WP_APP_PASSWORD" \
            -H "Accept: application/json" \
            "$WP_URL/wp-json/wp/v2/pages/$PAGE_ID?context=edit")"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::Unable to verify WordPress page (HTTP $CODE)"
            exit 1
          fi
          python - <<'PY'
          import json,sys
          req=json.load(open("partners-page-update.json",encoding="utf-8"))
          p=json.load(open("page-after.json",encoding="utf-8"))
          meta=(p.get("meta") or {}).get("_elementor_data")
          data=json.loads(meta) if isinstance(meta,str) else meta
          vals={}
          def walk(nodes):
              for n in nodes or []:
                  eid=n.get("id")
                  if eid==req["heading_element_id"]:
                      vals["heading"]=(n.get("settings") or {}).get("title")
                  if eid==req["intro_element_id"]:
                      vals["intro"]=(n.get("settings") or {}).get("editor")
                  if eid==req["closing_element_id"]:
                      vals["closing"]=(n.get("settings") or {}).get("editor")
                  walk(n.get("elements") or [])
          walk(data)
          checks=[
              vals.get("heading")==req["heading"],
              vals.get("intro")==req["intro_html"],
              vals.get("closing")==req["closing_html"]
          ]
          if not all(checks):
              print("Verification flags:",checks)
              sys.exit(2)
          print("Stored Elementor content verified exactly.")
          PY

      - name: Verify public page
        shell: bash
        run: |
          set -euo pipefail
          URL="$WP_URL/partenaires/?rtp1_verify=${{ github.run_id }}"
          OK=0
          for ATTEMPT in 1 2 3 4; do
            CODE="$(curl -sS -L -o public.html -w '%{http_code}' -H "Cache-Control: no-cache" "$URL")"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ] && \
               grep -Fq "Votre soutien a un impact concret" public.html && \
               grep -Fq "À quoi servent les contributions" public.html && \
               grep -Fq "Un partenariat qui doit aussi vous être utile" public.html && \
               grep -Fq "Envie de rejoindre l’aventure" public.html; then
              OK=1
              break
            fi
            sleep 5
          done
          if [ "$OK" != "1" ]; then
            echo "::warning::WordPress data is updated, but public HTML verification did not confirm all new headings yet (cache/WAF may be involved)."
          else
            echo "Public page verification passed."
          fi
